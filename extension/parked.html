<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>⏸ YouTube parked</title>
  <link rel="icon" href="icons/32.png?v=20261110" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="parked.js"></script>
</head>
<body class="parked-page">
  <header class="brand"><img src="icons/32.png" width="28" height="28" alt=""><span>Tab Parker<span class="brand-muted"> / YouTube</span></span></header>
  <main class="parking-card">
    <figure id="thumbnail-frame" class="thumbnail-frame" hidden><img id="video-thumbnail" width="320" height="180" alt="Parked YouTube video thumbnail" hidden></figure>
    <div class="parking-details">
    <div class="eyebrow"><span class="dot"></span>PARKED LOCALLY</div>
    <div class="pause-symbol" aria-hidden="true"><span></span><span></span></div>
    <h1>Your video<br>can wait.</h1>
    <p class="intro">A link for later. The YouTube player<br class="wide-only">and buffer stay off until you load the video.</p>
    <div class="video-reference"><span class="reference-label">YOUR LINK</span><p id="video-label">YouTube video</p><p id="video-channel" class="video-channel" hidden></p><p id="video-url" class="url"></p></div>
    <button type="button" id="load-video" class="primary" disabled>Load video<span aria-hidden="true">↗</span></button>
    <p id="message" class="message" role="status" aria-live="polite">Checking the link …</p>
    </div>
  </main>
  <footer class="parked-footer"><div><span id="thumbnail-note" role="status">The YouTube player stays off while this tab is parked.</span> <button id="retry-thumbnail" class="text-button" type="button" hidden>Retry thumbnail</button></div><button id="settings" class="text-button" type="button">Settings</button></footer>
</body>
</html>
